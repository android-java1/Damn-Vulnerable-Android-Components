name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to analyze'
        required: true
        default: 'java'

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # 'java' is CodeQL's canonical identifier for the whole JVM family
        # ('java-kotlin' and 'kotlin' are aliases of it). It covers the 26 Java
        # sources under app/src, which is all the code this project has: there
        # are no Kotlin, C/C++ or Dart sources here, only Java, XML resources and
        # the Kotlin-DSL Gradle files (build scripts are not analyzed).
        # On manual runs the value comes from the workflow_dispatch input above;
        # on push/pull_request/schedule it falls back to 'java'. One language id
        # per run - a comma-separated list would not expand into a matrix.
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning#changing-the-languages-that-are-analyzed
        language: ${{ fromJSON(format('["{0}"]', github.event.inputs.languages || 'java')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17, not 11: this project builds with AGP 8.4.0-alpha03
      # (gradle/libs.versions.toml) on Gradle 8.4, and AGP 8.x refuses to run on
      # anything below 17. Verified locally: the build below succeeds on
      # Temurin 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # gradlew is committed with mode 100644 (verified with 'git ls-files -s
      # gradlew'), so on the Linux runner './gradlew' would die with
      # "Permission denied" before Gradle ever starts.
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      # local.properties is committed and pins sdk.dir to
      # /home/zinjacoder/Android/Sdk, a path that does not exist on the runner.
      # ANDROID_HOME (preset on ubuntu-latest) does win over it in testing, but
      # dropping the file removes the ambiguity entirely and lets AGP use the
      # runner's SDK, auto-downloading the compileSdk 34 platform if needed.
      - name: Drop the checked-in local.properties
        run: rm -f local.properties

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      # settings.gradle.kts includes a single module, ':app', and it declares no
      # product flavors, so the task is ':app:compileDebugJavaWithJavac'.
      # Compiling just the Java sources is enough for the extractor and avoids
      # the packaging/lint work that 'assembleDebug' would add.
      # '--no-daemon' keeps the compiler under the CodeQL tracer.
      - name: Compile the Java sources
        run: ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
